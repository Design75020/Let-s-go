name: Codex AI Safety Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  codex-gate:
    name: OpenAI Codex Strict Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Initialize SQLite Database
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Build application
        run: npm run build

      - name: Execute Codex Structural Validation
        run: npm run codex:validate

      - name: Start application (background)
        run: |
          PORT=8080 npm run start &
          echo "Waiting for server on port 8080..."
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/api/health && break || sleep 3
          done
        env:
          DATABASE_URL: "file:./prisma/dev.db"
          PORT: "8080"

      - name: Execute Live Endpoints & SRE Gates
        run: npm run codex:gate
        env:
          TARGET_URL: ${{ secrets.STAGING_URL || 'http://localhost:8080' }}
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Execute Transactional Ledger Consistency Audit
        run: npm run codex:audit
        continue-on-error: true
