name: LetsGoFood V15 - SRE Production Gate

on:
  push:
    branches: [ "main" ]

env:
  NODE_VERSION: 20

jobs:
  sre_gate:
    name: SRE Health Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm test --if-present

      - name: Initialize SQLite Database
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Start application (background)
        run: |
          PORT=8080 npm run start &
          echo "Waiting for server on port 8080..."
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/api/health && break || sleep 3
          done
        env:
          DATABASE_URL: "file:./prisma/dev.db"
          PORT: "8080"

      - name: SRE Health Check - API
        run: |
          curl -f http://localhost:8080/api/health || exit 1

      - name: SRE Health Check - PostgreSQL
        run: |
          node scripts/check-postgres.js
        continue-on-error: true

      - name: SRE Health Check - Redis Streams
        run: |
          node scripts/check-redis.js
        continue-on-error: true

      - name: CQRS Drift Check
        run: |
          node scripts/check-cqrs-drift.js
        continue-on-error: true

      - name: System Health Evaluation
        id: sre
        run: |
          node scripts/sre-evaluate.js > sre_result.json
          cat sre_result.json
        continue-on-error: true

      - name: Fail if CRITICAL
        run: |
          if [ -f sre_result.json ]; then
            STATUS=$(cat sre_result.json | jq -r '.status' 2>/dev/null || echo "UNKNOWN")
            if [ "$STATUS" = "CRITICAL" ]; then
              echo "SRE Gate FAILED - CRITICAL SYSTEM STATE"
              exit 1
            fi
            echo "SRE Gate status: $STATUS"
          else
            echo "SRE evaluation skipped (no result file)"
          fi

      - name: Check GCP Configuration
        id: gcp-check
        run: |
          if [ -n "$GCP_PROJECT_ID" ]; then
            echo "gcp_available=true" >> $GITHUB_OUTPUT
            echo "✅ GCP configured — deployment will proceed"
          else
            echo "gcp_available=false" >> $GITHUB_OUTPUT
            echo "⚠️  GCP_PROJECT_ID not set — skipping Cloud Run deployment"
          fi
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate to Google Cloud
        if: steps.gcp-check.outputs.gcp_available == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        if: steps.gcp-check.outputs.gcp_available == 'true'
        run: |
          echo "Deploying to Cloud Run..."
          gcloud run deploy letsgofood-api \
            --source . \
            --region ${{ secrets.GCP_REGION || 'europe-west1' }} \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --platform managed \
            --allow-unauthenticated

      - name: Post Deployment Health Check
        if: steps.gcp-check.outputs.gcp_available == 'true'
        run: |
          sleep 15
          DEPLOYED_URL=$(gcloud run services describe letsgofood-api \
            --region ${{ secrets.GCP_REGION || 'europe-west1' }} \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --platform managed \
            --format='value(status.url)')
          if [ -n "$DEPLOYED_URL" ]; then
            echo "Testing deployed endpoint at: $DEPLOYED_URL/api/health"
            curl -f "$DEPLOYED_URL/api/health" || exit 1
          else
            echo "Warning: Could not extract deployed service URL"
          fi

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Deployment failed - triggering rollback"
          node scripts/rollback.js || echo "⚠️  Rollback script unavailable"
