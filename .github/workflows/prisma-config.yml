name: Prisma 7 Config Auto-Fix
on:
  push:
    branches: [ "main" ]
  pull_request:
jobs:
  prisma-config-migration:
    name: Migrate Prisma Config (v7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 1. Ensure prisma.config.ts uses defineConfig (Prisma 7 correct format)
      - name: Ensure correct prisma.config.ts format
        run: |
          printf "import path from 'path';\nimport { defineConfig } from 'prisma/config';\nexport default defineConfig({\n  earlyAccess: true,\n  schema: path.join('prisma', 'schema.prisma'),\n});\n" > prisma.config.ts

      # 2. Generate Prisma client (MUST run before tsc)
      - name: Prisma generate
        run: npx prisma generate

      # 3. TypeScript check (after prisma generate)
      - name: TypeScript check
        run: npx tsc --noEmit

      # 4. Commit auto-fix (only on main)
      - name: Commit changes if needed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git diff --quiet && echo "No changes to commit" || (git add prisma.config.ts && git commit -m "chore(prisma): enforce defineConfig format (Prisma 7)" && git push)

      # 5. Safety gate
      - name: Safety validation
        run: echo "Prisma 7 config validation OK"
