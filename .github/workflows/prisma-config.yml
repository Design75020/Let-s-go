name: Prisma 7 Config Auto-Fix

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  prisma-config-migration:
    name: Migrate Prisma Config (v7)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ─────────────────────────────────────────────
      # 1. Detect legacy Prisma config usage
      # ─────────────────────────────────────────────
      - name: Detect legacy Prisma config
        id: detect
        run: |
          if grep -r "prisma config" . || grep -r "@prisma/client" .; then
            echo "legacy=true" >> $GITHUB_OUTPUT
          else
            echo "legacy=false" >> $GITHUB_OUTPUT
          fi

      # ─────────────────────────────────────────────
      # 2. Auto-generate prisma.config.ts
      # ─────────────────────────────────────────────
      - name: Generate prisma.config.ts (if missing)
        if: steps.detect.outputs.legacy == 'true'
        run: |
          cat > prisma.config.ts << 'EOF'
          import { PrismaClient } from "@prisma/client";

          /**
           * Prisma 7+ Configuration Layer
           * Centralized DB client configuration
           */

          export const prisma = new PrismaClient({
            log: ["error", "warn"],
          });

          export default prisma;
          EOF

      # ─────────────────────────────────────────────
      # 3. Replace old Prisma imports
      # ─────────────────────────────────────────────
      - name: Update Prisma imports
        if: steps.detect.outputs.legacy == 'true'
        run: |
          for dir in server apps prisma source src; do
            if [ -d "$dir" ]; then
              find "$dir" -type f -name "*.ts" -exec sed -i 's/from "@prisma\/client"/from "..\/..\/prisma.config"/g' {} + || true
            fi
          done

      # ─────────────────────────────────────────────
      # 4. Format code
      # ─────────────────────────────────────────────
      - name: Format code
        run: |
          npm run format --if-present

      # ─────────────────────────────────────────────
      # 5. Type check
      # ─────────────────────────────────────────────
      - name: TypeScript check
        run: |
          npx tsc --noEmit

      # ─────────────────────────────────────────────
      # 6. Validate Prisma client
      # ─────────────────────────────────────────────
      - name: Prisma generate
        run: |
          npx prisma generate

      # ─────────────────────────────────────────────
      # 7. Commit auto-fix (only on main)
      # ─────────────────────────────────────────────
      - name: Commit changes
        if: github.ref == 'refs/heads/main' && steps.detect.outputs.legacy == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "chore(prisma): migrate to prisma.config.ts (auto-fix)"
          git push

      # ─────────────────────────────────────────────
      # 8. Safety gate
      # ─────────────────────────────────────────────
      - name: Safety validation
        run: |
          node -e "
            console.log('Prisma migration validation OK');
          "
