name: LetsGoFood CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Lint
        run: npm run lint
        
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Unit Tests
        run: npm run test
        
      - name: AI Security Scan
        run: npm run ai:scan
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
      - name: Build
        run: npm run build
        
      - name: Security Audit
        run: npm audit --audit-level=high
        
      - name: Load Smoke Test
        run: |
          # In a real CI, we'd run a k6 docker container or install k6
          echo "Running k6 load test smoke..."
          # docker run --rm -i grafana/k6 run - <tests/load/stress_test.js
          echo "k6 load test complete."

  deploy-preview:
    needs: build-and-test
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Vercel (Preview)
        run: echo "Deploying preview branch..."
        # integration with vercel-action would go here

  deploy-production:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        # uses: google-github-actions/auth@v2
        # with:
        #   credentials_json: ${{ secrets.GCP_SA_KEY }}
        run: echo "Authenticating to GCP..."

      - name: Build and Push to Artifact Registry
        run: |
          echo "docker build -t gcr.io/${{ secrets.GCP_PROJECT }}/letsgofood:latest ."
          echo "docker push gcr.io/${{ secrets.GCP_PROJECT }}/letsgofood:latest"

      - name: Deploy to Cloud Run
        run: |
          echo "gcloud run deploy letsgofood-api --image gcr.io/${{ secrets.GCP_PROJECT }}/letsgofood:latest --platform managed --region europe-west1"
