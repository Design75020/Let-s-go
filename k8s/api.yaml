apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgf-api
  labels:
    app: letsgo-api
spec:
  replicas: 10
  selector:
    matchLabels:
      app: letsgo-api
  template:
    metadata:
      labels:
        app: letsgo-api
    spec:
      containers:
      - name: api
        image: gcr.io/lgf-prod/api:v15.1
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "2Gi"
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lgf-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lgf-api
  minReplicas: 10
  maxReplicas: 200
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
