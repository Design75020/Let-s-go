name: Codex AI Safety Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  codex-gate:
    name: OpenAI Codex Strict Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Execute Codex Structural Validation
        run: npm run codex:validate

      - name: Build Application
        run: npm run build

      - name: Start Application Server (background)
        run: |
          DATABASE_URL="file:./prisma/ci-codex.db" npx prisma db push --skip-generate --accept-data-loss
          PORT=8080 node dist/server.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
        env:
          NODE_ENV: production
          PORT: "8080"
          DATABASE_URL: "file:./prisma/ci-codex.db"
          JWT_SECRET: "ci-codex-secret-key"
          FIREBASE_PROJECT_ID: "ci-test-project"

      - name: Wait for Server to be Ready
        run: |
          echo "Waiting for server on port 8080..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "✅ Server is ready after ${i}s"
              break
            fi
            echo "  Attempt $i/30..."
            sleep 2
          done

      - name: Execute Live Endpoints & SRE Gates
        run: npm run codex:gate
        env:
          TARGET_URL: "http://localhost:8080"

      - name: Execute Transactional Ledger Consistency Audit
        run: npm run codex:audit
