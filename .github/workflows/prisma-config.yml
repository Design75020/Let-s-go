name: Prisma 7 Config Auto-Fix

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  prisma-config-migration:
    name: Migrate Prisma Config (v7)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ─────────────────────────────────────────────
      # 1. Validate that prisma.config.ts uses defineConfig (Prisma 7)
      # ─────────────────────────────────────────────
      - name: Validate Prisma 7 config format
        id: detect
        run: |
          if [ -f "prisma.config.ts" ]; then
            if grep -q "defineConfig\|PrismaConfig" prisma.config.ts; then
              echo "status=valid" >> $GITHUB_OUTPUT
              echo "✅ prisma.config.ts uses Prisma 7 defineConfig format"
            else
              echo "status=legacy" >> $GITHUB_OUTPUT
              echo "⚠️  prisma.config.ts uses legacy format - will migrate"
            fi
          else
            echo "status=missing" >> $GITHUB_OUTPUT
            echo "ℹ️  prisma.config.ts not found - will create"
          fi

      # ─────────────────────────────────────────────
      # 2. Auto-generate correct Prisma 7 config (only if needed)
      # ─────────────────────────────────────────────
      - name: Generate prisma.config.ts (Prisma 7 format)
        if: steps.detect.outputs.status != 'valid'
        run: |
          cat > prisma.config.ts << 'PRISMAEOF'
          import type { PrismaConfig } from 'prisma';

          export default {
            earlyAccess: true,
            schema: {
              kind: 'single',
              filePath: './prisma/schema.prisma',
            },
          } satisfies PrismaConfig;
          PRISMAEOF
          echo "✅ prisma.config.ts generated with Prisma 7 defineConfig format"

      # ─────────────────────────────────────────────
      # 3. Validate Prisma client generation
      # ─────────────────────────────────────────────
      - name: Prisma generate
        run: |
          DATABASE_URL="file:./prisma/dev.db" npx prisma generate
          echo "✅ Prisma client generated successfully"

      # ─────────────────────────────────────────────
      # 4. TypeScript check
      # ─────────────────────────────────────────────
      - name: TypeScript check
        run: |
          npx tsc --noEmit
          echo "✅ TypeScript: 0 errors"

      # ─────────────────────────────────────────────
      # 5. Commit auto-fix (only on main, only if changed)
      # ─────────────────────────────────────────────
      - name: Commit changes
        if: github.ref == 'refs/heads/main' && steps.detect.outputs.status != 'valid'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add prisma.config.ts
          git diff --staged --quiet || git commit -m "chore(prisma): migrate to Prisma 7 defineConfig format (auto-fix)"
          git diff --staged --quiet || git push

      # ─────────────────────────────────────────────
      # 6. Safety gate
      # ─────────────────────────────────────────────
      - name: Safety validation
        run: |
          node -e "console.log('✅ Prisma 7 migration validation OK');"
