name: Cloud Run Canary Deploy with Auto-Rollback

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: letsgofood-v15-prod
  REGION: europe-west1
  SERVICE_NAME: letsgofood-api

jobs:
  canary_rollout:
    name: Canary 10% Progressive Deploy & SRE Overwatch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
        continue-on-error: true

      - name: Build and Push Docker image
        run: |
          echo "Simulated Docker build..."
          echo "gcloud builds submit --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest ."

      # ─────────────────────────────────────────────────────────────
      # Step 1: Deploy Canary version at 0% traffic allocation
      # ─────────────────────────────────────────────────────────────
      - name: Create Canary Revision (0% Traffic)
        run: |
          echo "Deploying Canary revision to Cloud Run..."
          # Deploy new container image tagging it as 'canary' but receiving 0% traffic split rules
          echo "gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest \
            --region ${{ env.REGION }} \
            --no-traffic \
            --tag canary"

      # ─────────────────────────────────────────────────────────────
      # Step 2: Push Canary revision into 10% traffic split
      # ─────────────────────────────────────────────────────────────
      - name: Expose Canary to 10% Traffic
        run: |
          echo "Switching traffic split ratio: latest=90, canary=10 ..."
          # gcloud run services update-traffic ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --to-revisions latest=90,canary=10

      # ─────────────────────────────────────────────────────────────
      # Step 3: Run Active SRE Diagnostics Overwatch Checks
      # ─────────────────────────────────────────────────────────────
      - name: SRE Diagnostic Check (10% Traffic Gate)
        run: |
          echo "Running active diagnostics checks against canary endpoints..."
          node scripts/canary-monitor.js

      # ─────────────────────────────────────────────────────────────
      # Step 4: Ramp split to 50% traffic if stable
      # ─────────────────────────────────────────────────────────────
      - name: Ramp Canary to 50% Traffic
        run: |
          echo "Canary stable at 10%. Escalating traffic split ratio: latest=50, canary=50 ..."
          # gcloud run services update-traffic ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --to-revisions latest=50,canary=50

      - name: SRE Diagnostic Check (50% Traffic Gate)
        run: |
          echo "Polling performance indicator metrics for latency drift..."
          node scripts/canary-monitor.js

      # ─────────────────────────────────────────────────────────────
      # Step 5: Complete rollout to 100% stable active
      # ─────────────────────────────────────────────────────────────
      - name: Push Stable Canary to 100% Traffic
        if: success()
        run: |
          echo "Canary fully validated. Promoting canary revision tag to 100% traffic champion..."
          # gcloud run services update-traffic ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --to-revisions latest=100

      # ─────────────────────────────────────────────────────────────
      # Step 6: Trigger automatic rollback on any pipeline failure
      # ─────────────────────────────────────────────────────────────
      - name: SRE Auto-Rollback Emergency Action
        if: failure()
        run: |
          echo "🚨 [SRE PIPELINE FAULT] Anomaly or verification failure detected. Resetting traffic to 100% stable v1 master revision..."
          node scripts/rollback.js || echo "⚠️  Rollback script unavailable - manual intervention required"
          # gcloud run services update-traffic ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --to-revisions latest=100
        env:
          TARGET_URL: ${{ secrets.STAGING_URL || 'http://localhost:8080' }}
