name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build, Validate and Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        continue-on-error: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/letsgofood/letsgofood-v15:${{ github.sha }} .
          docker push europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/letsgofood/letsgofood-v15:${{ github.sha }}

      - name: Deploy to Cloud Run Staging
        id: deploy-staging
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: letsgofood-v15-staging
          image: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/letsgofood/letsgofood-v15:${{ github.sha }}
          region: europe-west1
          flags: '--allow-unauthenticated --port=8080'

      - name: Validate Staging Liveness Health Check
        run: |
          STAGING_URL="${{ steps.deploy-staging.outputs.url }}"
          echo "Staging Deployment Live at: $STAGING_URL"
          echo "Querying liveness health probe endpoint..."
          
          # Wait up to 30s for staging environment to run/boot
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/api/health" || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Staging Validation Passed!"
              exit 0
            fi
            echo "Waiting for staging liveness check... Status: $STATUS"
            sleep 5
          done
          echo "CRITICAL SRE VALVE: Staging microservice failed /api/health validation check! Rollback/abortion initiated."
          exit 1

      - name: Deploy to Cloud Run Production
        id: deploy-production
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: letsgofood-v15
          image: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/letsgofood/letsgofood-v15:${{ github.sha }}
          region: europe-west1
          flags: '--allow-unauthenticated --port=8080'
