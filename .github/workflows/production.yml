name: LGF V15 Production Hardened Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Strict
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  gate:
    name: SRE Validation Gate
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Initialize Database for SRE Test
        run: |
          DATABASE_URL="file:./prisma/ci-sre.db" npx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: "file:./prisma/ci-sre.db"

      - name: Start Background SRE Test Instance
        run: |
          PORT=3000 DATABASE_URL="file:./prisma/ci-sre.db" JWT_SECRET="ci-sre-secret" npm run dev &
          echo "Waiting for SRE test instance on port 3000..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ Server ready after ${i}s"
              break
            fi
            sleep 2
          done
        env:
          DATABASE_URL: "file:./prisma/ci-sre.db"
          JWT_SECRET: "ci-sre-secret-key"

      # Run against the local background server OR Staging URL if provided
      - name: Run SRE Gate Simulation
        run: node scripts/verify-live.js
        env:
          TARGET_URL: ${{ secrets.STAGING_URL || 'http://localhost:3000' }}
          SRE_MODE: mvp

  cd:
    name: Production Deployment (Cloud Run)
    needs: gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Docker Build & Push
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/lgf-api:${{ github.sha }} -f Dockerfile.prod .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/lgf-api:${{ github.sha }}

      - name: Deploy Canary (10% Traffic)
        run: |
          gcloud run deploy lgf-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/lgf-api:${{ github.sha }} \
            --no-traffic \
            --tag canary \
            --region europe-west1
          
          gcloud run services update-traffic lgf-api \
            --to-revisions canary=10 \
            --region europe-west1

      - name: Post-Deploy Health Check
        run: node scripts/verify-live.js
        env:
          TARGET_URL: "https://canary---lgf-api-hash.a.run.app"
          SRE_MODE: mvp

      - name: Full Traffic Promotion
        if: success()
        run: |
          gcloud run services update-traffic lgf-api \
            --to-revisions LATEST=100 \
            --region europe-west1

      - name: Auto-Rollback on Failure
        if: failure()
        run: |
          echo "GATE FAILED. ROLLING BACK."
          gcloud run services update-traffic lgf-api \
            --to-revisions LATEST=0 \
            --region europe-west1
