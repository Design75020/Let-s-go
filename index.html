<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LetsGoFood :: Commande Halal, SaaS Restaurateurs & Logistique</title>
    <meta name="description" content="LetsGoFood est l'écosystème leader pour la livraison de repas Halal. Gérez vos points de vente sur merchant.letsgofood.fr et commandez sur app.letsgofood.fr." />
    <meta name="keywords" content="Halal, livraison, restaurant, SaaS, marchand, chauffeur, letsgofood" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://letsgofood.fr" />
    <link rel="icon" type="image/svg+xml" href="https://api.lucide.dev/icons/utensils.svg" />
  </head>
  <body>
    <div id="root"></div>
    <div id="error-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); color:red; padding:20px; font-family:monospace; z-index:9999; overflow:auto;">
      <h1 style="color:white">Runtime Error Detected</h1>
      <pre id="error-message"></pre>
    </div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-message').innerText = msg + '\nAt: ' + url + ':' + lineNo + ':' + columnNo + '\n\n' + (error ? error.stack : '');
        return false;
      };
      window.onunhandledrejection = function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-message').innerText = 'Unhandled Promise Rejection: ' + event.reason;
      };
    </script>
    <script type="module" src="/source/main.tsx"></script>
  </body>
</html>
