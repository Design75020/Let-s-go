name: LGF V15 Production Hardened Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Strict
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  gate:
    name: SRE Validation Gate
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Initialize SQLite Database
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Start Background SRE Test Instance
        run: |
          PORT=8080 npm run start &
          echo "SRE local target listening on port 8080"
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/api/health && break || sleep 3
          done
        env:
          DATABASE_URL: "file:./prisma/dev.db"
          PORT: "8080"

      # Run against the local background server OR Staging URL if provided
      - name: Run SRE Gate Simulation
        run: node scripts/verify-live.js
        env:
          TARGET_URL: ${{ secrets.STAGING_URL || 'http://localhost:8080' }}
          DATABASE_URL: "file:./prisma/dev.db"
          SRE_MODE: mvp

  cd:
    name: Production Deployment (Cloud Run)
    needs: gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Docker Build & Push
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/lgf-api:${{ github.sha }} -f Dockerfile.prod .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/lgf-api:${{ github.sha }}

      - name: Deploy Canary (10% Traffic)
        run: |
          gcloud run deploy lgf-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/lgf-api:${{ github.sha }} \
            --no-traffic \
            --tag canary \
            --region europe-west1
          
          gcloud run services update-traffic lgf-api \
            --to-revisions canary=10 \
            --region europe-west1

      - name: Post-Deploy Health Check
        run: node scripts/verify-live.js
        env:
          TARGET_URL: "https://canary---lgf-api-hash.a.run.app"
          SRE_MODE: mvp

      - name: Full Traffic Promotion
        if: success()
        run: |
          gcloud run services update-traffic lgf-api \
            --to-revisions LATEST=100 \
            --region europe-west1

      - name: Auto-Rollback on Failure
        if: failure()
        run: |
          echo "GATE FAILED. ROLLING BACK."
          gcloud run services update-traffic lgf-api \
            --to-revisions LATEST=0 \
            --region europe-west1
